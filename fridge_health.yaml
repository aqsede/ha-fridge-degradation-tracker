# /config/packages/fridge_health.yaml
# configuration.yaml needs:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Fridge degradation tracker. Source: sensor.fridge_fridge_total_energy (kWh, total_increasing)
# Zero manual input:
#   * baseline self-seeds (52.5 W = best 30-day night idle in your 12-month export) and only ever ratchets DOWN
#   * grocery days can't skew it: metric = median of the nightly idle window (door closed, nobody shopping)
# Idle window: input_datetime.fridge_idle_start / fridge_idle_end (default 00:30 - 04:30).
#   Change them any time in the UI (Settings > Devices & services > Helpers). Keep start < end, same day, end before ~06:00.
#   * grocery days are auto-detected and counted, not excluded by hand
# One-time edit: the notify service in the three automations marked  # EDIT
# Fast alert: 1h-average power > 1.5x normal idle for 8h straight (door ajar / seal not holding) -> notification

input_number:
  fridge_base_night_w:
    name: Fridge baseline night idle (auto)
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: W
    mode: box

input_datetime:
  fridge_idle_start:
    name: Fridge idle window start
    has_date: false
    has_time: true
  fridge_idle_end:
    name: Fridge idle window end
    has_date: false
    has_time: true

utility_meter:
  fridge_kwh_today:
    source: sensor.fridge_fridge_total_energy
    cycle: daily
  fridge_tariff:            # accumulates only while select.fridge_tariff = night (the idle window)
    source: sensor.fridge_fridge_total_energy
    cycle: daily
    tariffs: [night, "off"]

automation:
  - id: fridge_night_window
    alias: Fridge idle window switch
    mode: restart
    triggers:
      - trigger: time
        at: input_datetime.fridge_idle_start
      - trigger: time
        at: input_datetime.fridge_idle_end
      - trigger: state                 # re-evaluates right after you edit the window
        entity_id:
          - input_datetime.fridge_idle_start
          - input_datetime.fridge_idle_end
      - trigger: homeassistant
        event: start
    actions:
      - if:                            # first run ever: helpers are unset (00:00) -> seed defaults
          - condition: state
            entity_id: input_datetime.fridge_idle_start
            state: "00:00:00"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.fridge_idle_start
            data:
              time: "00:30:00"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.fridge_idle_end
            data:
              time: "04:30:00"
      - action: select.select_option
        target:
          entity_id: select.fridge_tariff
        data:
          option: >
            {% set n = now().strftime('%H:%M:%S') %}
            {{ 'night' if states('input_datetime.fridge_idle_start') <= n < states('input_datetime.fridge_idle_end') else 'off' }}

  - id: fridge_baseline_selfcalibrate
    alias: Fridge baseline self-calibrate
    mode: single
    variables:
      seed_night_w: 52.5
    triggers:
      - trigger: time
        at:
          entity_id: input_datetime.fridge_idle_end
          offset: "00:20:00"
      - trigger: homeassistant
        event: start
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.fridge_base_night_w
        data:
          value: >
            {% set b = states('input_number.fridge_base_night_w') | float(0) %}
            {% set cur = states('sensor.fridge_night_idle_median_30d') | float(0) %}
            {% set n = states('sensor.fridge_night_samples_30d') | float(0) %}
            {% if b <= 0 %}{{ seed_night_w }}
            {% elif n >= 14 and 30 < cur < b %}{{ cur }}
            {% else %}{{ b }}{% endif %}

  - id: fridge_health_alert
    alias: Fridge health alert
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.fridge_health_status
        from: [ok, learning]
        to: watch
        for: "12:00:00"
        id: watch
      - trigger: state
        entity_id: sensor.fridge_health_status
        from: watch
        to: service
        for: "12:00:00"
        id: service
      - trigger: state
        entity_id: sensor.fridge_health_status
        from: [watch, service]
        to: ok
        id: recovered
    actions:
      - variables:
          msg: >
            {% if trigger.id == 'recovered' %}
            Fridge idle power back to normal ({{ states('sensor.fridge_idle_drift') }}% vs best).
            {% else %}
            {{ 'SERVICE' if trigger.id == 'service' else 'Watch' }}: fridge night idle is
            {{ states('sensor.fridge_night_idle_median_30d') }} W, {{ states('sensor.fridge_idle_drift') }}% above its
            best ({{ states('input_number.fridge_base_night_w') }} W). Typical day {{ states('sensor.fridge_energy_median_30d') }} kWh
            (grocery days excluded; {{ states('sensor.fridge_grocery_days_30d') | int(0) }} in last 30d).
            Check: condenser coil/back dust, door gaskets (paper test), vents blocked, hot room, frost build-up.
            {% endif %}
      - action: persistent_notification.create
        data:
          notification_id: fridge_health
          title: Fridge health
          message: "{{ msg }}"
      - action: notify.mobile_app_oneplus_11          # EDIT -> notify.mobile_app_<your_phone>
        data:
          title: Fridge health
          message: "{{ msg }}"

  - id: fridge_sustained_load_alert
    alias: Fridge sustained high load alert
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.fridge_sustained_high_load
        to: "on"
        for: "08:00:00"
        id: alert
      - trigger: state
        entity_id: binary_sensor.fridge_sustained_high_load
        from: "on"
        to: "off"
        id: recovered
    conditions:
      - condition: template
        value_template: >
          {{ trigger.id == 'alert' or (now() - trigger.from_state.last_changed).total_seconds() > 8 * 3600 }}
    actions:
      - variables:
          msg: >
            {% if trigger.id == 'alert' %}
            Fridge has been working hard for 8+ hours (~{{ (states('sensor.fridge_energy_last_hour') | float(0) * 1000) | round(0) }} W vs
            ~{{ states('sensor.fridge_night_idle_median_30d') }} W normal idle). Door not shut / gasket not sealing /
            overstuffed or blocked vent? Check the doors now.
            {% else %}
            Fridge load back to normal.
            {% endif %}
      - action: persistent_notification.create
        data:
          notification_id: fridge_sustained_load
          title: Fridge door / load
          message: "{{ msg }}"
      - action: notify.mobile_app_oneplus_11          # EDIT -> notify.mobile_app_<your_phone>
        data:
          title: Fridge door / load
          message: "{{ msg }}"

  - id: fridge_monthly_digest
    alias: Fridge monthly digest
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: template
        value_template: "{{ now().day == 1 }}"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.fridge_health_status
            state: learning
    actions:
      - action: notify.mobile_app_oneplus_11          # EDIT -> notify.mobile_app_<your_phone>
        data:
          title: Fridge monthly
          message: >
            Health {{ states('sensor.fridge_health_score') }}/100 ({{ states('sensor.fridge_health_status') }}).
            Night idle {{ states('sensor.fridge_night_idle_median_30d') }} W
            ({{ states('sensor.fridge_idle_drift') }}% vs best). Typical day {{ states('sensor.fridge_energy_median_30d') }} kWh,
            {{ states('sensor.fridge_grocery_days_30d') | int(0) }} heavy/grocery days.

template:
  # One daily snapshot 10 min after the idle window closes (after midnight, so yesterday's meter has rolled over)
  - triggers:
      - trigger: time
        at:
          entity_id: input_datetime.fridge_idle_end
          offset: "00:10:00"
    sensor:
      - name: Fridge night idle power
        unique_id: fridge_night_idle_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set k = states('sensor.fridge_tariff_night') | float(none) %}
          {% set a = states('input_datetime.fridge_idle_start').split(':') %}
          {% set b = states('input_datetime.fridge_idle_end').split(':') %}
          {% set hrs = ((b[0] | int * 60 + b[1] | int) - (a[0] | int * 60 + a[1] | int)) / 60 %}
          {% set w = k * 1000 / hrs if k is not none and hrs > 0.5 else none %}
          {{ w | round(1) if states('select.fridge_tariff') == 'off' and w is not none and 10 < w < 300 else none }}

      - name: Fridge energy yesterday
        unique_id: fridge_energy_yesterday
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >
          {% set y = state_attr('sensor.fridge_kwh_today', 'last_period') | float(none) %}
          {{ y | round(3) if y is not none and y > 0.8 else none }}

      - name: Fridge heavy day flag
        unique_id: fridge_heavy_day_flag
        state_class: measurement
        state: >
          {% set y = state_attr('sensor.fridge_kwh_today', 'last_period') | float(none) %}
          {% set m = states('sensor.fridge_energy_median_30d') | float(none) %}
          {{ (1 if y > 1.25 * m else 0) if y is not none and m is not none and y > 0.8 else none }}

  - binary_sensor:
      - name: Fridge sustained high load
        unique_id: fridge_sustained_high_load
        device_class: problem
        delay_off: "01:00:00"          # bridges 1h dips so one long episode stays one episode
        availability: "{{ states('sensor.fridge_energy_last_hour') | is_number }}"
        state: >
          {% set ref = states('sensor.fridge_night_idle_median_30d') | float(0) %}
          {% set ref = ref if ref > 30 else states('input_number.fridge_base_night_w') | float(0) %}
          {% set ref = ref if ref > 30 else 52.5 %}
          {{ states('sensor.fridge_energy_last_hour') | float(0) * 1000 > 1.5 * ref }}

  - sensor:
      - name: Fridge idle drift
        unique_id: fridge_idle_drift
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{ states('sensor.fridge_night_samples_30d') | float(0) >= 14
             and states('input_number.fridge_base_night_w') | float(0) > 0
             and states('sensor.fridge_night_idle_median_30d') | float(0) > 0 }}
        state: >
          {{ ((states('sensor.fridge_night_idle_median_30d') | float / states('input_number.fridge_base_night_w') | float - 1) * 100) | round(1) }}

      - name: Fridge health status
        unique_id: fridge_health_status
        icon: mdi:fridge-alert-outline
        state: >
          {% set d = states('sensor.fridge_idle_drift') | float(none) %}
          {% set prev = this.state | default('learning') %}
          {%- if d is none -%}learning
          {%- elif d >= 25 or (prev == 'service' and d >= 19) -%}service
          {%- elif d >= 12 or (prev in ['watch', 'service'] and d >= 8) -%}watch
          {%- else -%}ok{%- endif -%}

      - name: Fridge health score
        unique_id: fridge_health_score
        unit_of_measurement: "/100"
        state_class: measurement
        availability: "{{ states('sensor.fridge_idle_drift') | is_number }}"
        state: "{{ [0, [100, 100 - 2 * states('sensor.fridge_idle_drift') | float(0)] | min] | max | round(0) }}"

sensor:
  - platform: statistics
    name: Fridge night idle median 30d
    unique_id: fridge_night_idle_median_30d
    entity_id: sensor.fridge_night_idle_power
    state_characteristic: median
    max_age: {days: 30}
    sampling_size: 45
    precision: 1

  - platform: statistics
    name: Fridge night samples 30d
    unique_id: fridge_night_samples_30d
    entity_id: sensor.fridge_night_idle_power
    state_characteristic: count
    max_age: {days: 30}
    sampling_size: 45

  - platform: statistics
    name: Fridge energy median 30d
    unique_id: fridge_energy_median_30d
    entity_id: sensor.fridge_energy_yesterday
    state_characteristic: median
    max_age: {days: 30}
    sampling_size: 45
    precision: 2

  - platform: statistics
    name: Fridge grocery days 30d
    unique_id: fridge_grocery_days_30d
    entity_id: sensor.fridge_heavy_day_flag
    state_characteristic: sum
    max_age: {days: 30}
    sampling_size: 45
    precision: 0

  - platform: statistics
    name: Fridge energy last hour
    unique_id: fridge_energy_last_hour
    entity_id: sensor.fridge_fridge_total_energy
    state_characteristic: change
    max_age: {hours: 1}
    sampling_size: 120
    precision: 3
